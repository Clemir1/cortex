# =============================================================================
# Delta sobre default.toml; chaves não citadas herdam default.
# Sobrescreve [platform.gpu] quando selecionado (ex.: --hardware wgpu).
#
# config/hardware/wgpu.toml — PERFIL WGPU (abstração multi-backend)
# Adapters preferidos em ordem: Vulkan → DX12 → Metal. Limites reais do
# adapter (max_compute_workgroup_invocations etc.) são lidos em runtime —
# os valores abaixo são limites seguros típicos.
# =============================================================================

[gpu]
backend = "wgpu"
vendor = "any"
model = "any"
device_hints = ["vulkan", "dx12", "metal"]   # preferência de adapters, em ordem
compute_units = 0                 # 0 = consultar limites do adapter em runtime
compute_threads = 0               # 0 = consultar em runtime
default_workgroup_size = 64
max_workgroup_size = 256          # limite típico de compute workgroup invocations
preferred_workgroup_multiple = 32
max_memory_mb = 4096
reserved_memory_mb = 512
