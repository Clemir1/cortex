[package]
name = "triad-l2-tissue"
version = "0.1.0"
edition = "2021"

[dependencies]
triad-foundation = { path = "../foundation" }
triad-contracts = { path = "../contracts" }
triad-runtime = { path = "../runtime" }
triad-l1-substrate = { path = "../l1_substrate" }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1" }
rand = { version = "0.8", features = ["small_rng"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
toml = "0.8"
# 18.7 — hash_aa estendido às camadas L4/L5 (A/A bit-exato).
triad-l4-global = { path = "../l4_global" }
triad-l5-meta = { path = "../l5_metacognition" }
